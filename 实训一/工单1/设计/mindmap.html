<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>招股说明书智能问答系统 - 思维导图</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
    --accent: #818cf8;
    --success: #6ee7b7;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    overflow-x: auto;
  }
  main {
    max-width: 1400px;
    margin: 24px auto;
    padding: 0 20px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 16px; font-weight: 700; }
  .label { font-size: 13px; font-weight: 600; }
  .small { font-size: 11px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; rx: 8; ry: 8; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.6; rx: 12; ry: 12; }
  .legend-box { fill: var(--neutral); stroke: var(--line); stroke-width: 1; rx: 6; ry: 6; }
