<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG vs LightRAG 评估对比</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f7f7f8;
      --border: #e5e5e5;
      --text: #1a1a1a;
      --text-secondary: #6b6b6b;
      --primary: #10a37f;
      --primary-light: #f0fdf9;
      --purple: #667eea;
      --purple-light: #f0f0ff;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Header ─────────────────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-secondary); text-decoration: none;
      font-size: 13px; transition: all 0.15s;
    }
    .back-btn:hover { border-color: var(--primary); color: var(--primary); }
    .header h1 {
      font-size: 22px; font-weight: 700; color: var(--text);
    }
    .header h1 span { color: var(--purple); }

    /* ── Loading / Empty ────────────────────────────── */
    .loading-state, .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 24px; text-align: center;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--purple);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state svg { color: var(--text-secondary); margin-bottom: 16px; }
    .empty-state p { color: var(--text-secondary); font-size: 14px; }
    .empty-state code {
      display: inline-block; margin-top: 8px; padding: 4px 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; color: var(--purple);
    }

    /* ── Summary Cards ──────────────────────────────── */
    .summary-cards {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 16px; margin-bottom: 32px;
    }
    .summary-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      text-align: center; box-shadow: var(--shadow-sm);
    }
    .summary-card .card-value {
      font-size: 32px; font-weight: 700; margin-bottom: 4px;
    }
    .summary-card .card-label {
      font-size: 13px; color: var(--text-secondary);
    }
    .card-rag .card-value { color: var(--primary); }
    .card-lightrag .card-value { color: var(--purple); }
    .card-tie .card-value { color: var(--warning); }

    /* ── Table ──────────────────────────────────────── */
    .table-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow-sm); margin-bottom: 32px;
    }
    .table-card-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      font-size: 15px; font-weight: 600;
    }
    table {
      width: 100%; border-collapse: collapse;
    }
    thead th {
      padding: 12px 16px; text-align: left;
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-secondary);
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
    }
    thead th:nth-child(2), thead th:nth-child(3), thead th:nth-child(4) {
      text-align: center;
    }
    tbody td {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--bg-secondary); }

    .metric-name { font-weight: 600; }
    .metric-desc {
      display: block; font-size: 12px; color: var(--text-secondary);
      margin-top: 2px; font-weight: 400;
    }

    .score-cell { text-align: center; font-weight: 600; font-size: 15px; }
    .score-cell.winner { position: relative; }
    .score-cell.winner::after {
      content: '👑';
      font-size: 10px; position: absolute;
      top: 8px; margin-left: 4px;
    }

    .score-rag { color: var(--primary); }
    .score-lightrag { color: var(--purple); }
    .score-cell.bg-rag { background: var(--primary-light); }
    .score-cell.bg-lightrag { background: var(--purple-light); }

    .winner-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
    }
    .winner-rag { background: var(--primary-light); color: var(--primary); }
    .winner-lightrag { background: var(--purple-light); color: var(--purple); }
    .winner-tie { background: #fef3c7; color: #92400e; }

    /* ── Footer ─────────────────────────────────────── */
    .footer {
      text-align: center; padding: 16px;
      color: var(--text-secondary); font-size: 12px;
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 640px) {
      .summary-cards { grid-template-columns: 1fr; }
      .header { flex-direction: column; gap: 12px; align-items: flex-start; }
      thead th, tbody td { padding: 10px 8px; font-size: 12px; }
      .metric-desc { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <a href="/" class="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          返回问答
        </a>
        <h1>📊 RAG vs <span>LightRAG</span> 评估对比</h1>
      </div>
    </div>

    <div id="content">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>正在加载评估数据...</p>
      </div>
    </div>
  </div>

  <script>
    const contentEl = document.getElementById('content');

    async function loadEvalData() {
      try {
        const res = await fetch('/api/comparison-table');
        if (!res.ok) throw new Error('Failed to load');
        const data = await res.json();

        if (data.status === 'not_found') {
          showEmpty();
          return;
        }

        renderResults(data);
      } catch (e) {
        showEmpty();
      }
    }

    function showEmpty() {
      contentEl.innerHTML = `
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 20V10M12 20V4M6 20v-6"/>
          </svg>
          <p>暂无评估数据，请先运行评估脚本：</p>
          <code>python eval/ragas_eval.py</code>
        </div>
      `;
    }

    function renderResults(data) {
      const metrics = data.metrics || [];
      const summary = data.summary || { rag_wins: 0, lightrag_wins: 0, ties: 0 };

      // Summary cards
      let html = `
        <div class="summary-cards">
          <div class="summary-card card-rag">
            <div class="card-value">${summary.rag_wins}</div>
            <div class="card-label">RAG 胜出指标</div>
          </div>
          <div class="summary-card card-tie">
            <div class="card-value">${summary.ties}</div>
            <div class="card-label">平局</div>
          </div>
          <div class="summary-card card-lightrag">
            <div class="card-value">${summary.lightrag_wins}</div>
            <div class="card-label">LightRAG 胜出指标</div>
          </div>
        </div>
      `;

      // Table
      html += `
        <div class="table-card">
          <div class="table-card-header">📋 指标详细对比</div>
          <table>
            <thead>
              <tr>
                <th>评估指标</th>
                <th>RAG 得分</th>
                <th>LightRAG 得分</th>
                <th>优胜者</th>
              </tr>
            </thead>
            <tbody>
      `;

      metrics.forEach(m => {
        const ragClass = m.winner === 'rag' ? 'bg-rag' : '';
        const lrClass = m.winner === 'lightrag' ? 'bg-lightrag' : '';
        const ragWinner = m.winner === 'rag' ? ' winner' : '';
        const lrWinner = m.winner === 'lightrag' ? ' winner' : '';

        let winnerBadge = '';
        if (m.winner === 'rag') {
          winnerBadge = '<span class="winner-badge winner-rag">🏆 RAG</span>';
        } else if (m.winner === 'lightrag') {
          winnerBadge = '<span class="winner-badge winner-lightrag">🏆 LightRAG</span>';
        } else {
          winnerBadge = '<span class="winner-badge winner-tie">🤝 平局</span>';
        }

        html += `
          <tr>
            <td>
              <span class="metric-name">${m.name_cn || m.name}</span>
              <span class="metric-desc">${m.description || ''}</span>
            </td>
            <td class="score-cell score-rag${ragClass}${ragWinner}">${(m.rag_score * 100).toFixed(1)}%</td>
            <td class="score-cell score-lightrag${lrClass}${lrWinner}">${(m.lightrag_score * 100).toFixed(1)}%</td>
            <td style="text-align:center;">${winnerBadge}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      // Conclusion
      let conclusion = '';
      if (summary.lightrag_wins > summary.rag_wins) {
        conclusion = '🎉 <strong>LightRAG</strong> 在更多指标上表现更优，知识图谱的引入提升了检索质量。';
      } else if (summary.rag_wins > summary.lightrag_wins) {
        conclusion = '📊 <strong>RAG</strong> 在更多指标上表现更好，当前数据集下传统方法已足够。';
      } else {
        conclusion = '⚖️ 两种方法表现相当，各有优势。';
      }

      html += `
        <div class="table-card" style="padding:20px;">
          <strong>📝 总结：</strong> ${conclusion}
        </div>
      `;

      contentEl.innerHTML = html;
    }

    loadEvalData();
  </script>
</body>
</html>
