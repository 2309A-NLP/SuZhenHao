<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能文档问答系统（RAG + 知识图谱 + 语音识别） - 思维导图</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc; --fg: #172033; --muted: #5b6475; --line: #64748b;
    --neutral: #e2e8f0; --input: #bfdbfe; --process: #c7d2fe;
    --storage: #99f6e4; --external: #fde68a; --risk: #fecaca;
    --kg: #f9a8d4; --speech: #a5b4fc; --rag: #86efac;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; overflow-x: auto; }
  main { max-width: 1460px; margin: 24px auto; padding: 0 20px; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .badge { display: inline-block; background: var(--kg); color: #831843; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 3px; }
  .badge-kg { display: inline-block; background: var(--kg); color: #831843; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
  .badge-speech { display: inline-block; background: var(--speech); color: #3730a3; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
  .badge-rag { display: inline-block; background: var(--rag); color: #14532d; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 16px; font-weight: 700; }
  .label { font-size: 13px; font-weight: 600; }
  .small { font-size: 11px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; rx: 8; ry: 8; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.6; rx: 12; ry: 12; }
</style>
<main>

  <span class="badge-rag">🔍 RAG</span>

  <span class="badge">📄 PDF解析</span>
  <span class="badge">🌐 中英文</span>
</p>
